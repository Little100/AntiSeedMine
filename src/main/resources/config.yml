timestamp:
  # WORLD_CREATION: 世界创建时间 | SERVER_START: 服务端启动时间 | CUSTOM: 自定义时间戳
  source: WORLD_CREATION
  custom-value: 0

offset:
  x:
    min: 5
    max: 10
  z:
    min: 5
    max: 10
  y:
    min: 1
    max: 2

worlds:
  enable-all: true
  enabled-worlds:
    - world
    - world_nether
    - world_the_end

# 矿物偏移后等待 1 tick 再执行一次验证扫描。
# 如果你更看重兼容性和生效率，建议保持开启。
aggressive-verify: true

# 已加载区块再次加载时是否重新扫描。
# 该选项会增加服务器负载，通常建议关闭，只在修复旧地图时临时开启。
recheck-loaded-chunks: false

performance:
  # 每 tick 最多提交多少个区块扫描任务。
  # 数值越低，跑图或预生成时的 TPS 波动越小，但矿物偏移会略微延后。
  max-chunks-per-tick: 2

  # 最近已处理区块缓存上限，用于避免新区块事件重复处理。
  # 该上限可以防止长期运行的大地图服务器内存持续增长。
  processed-chunk-cache-size: 100000

debug: false
