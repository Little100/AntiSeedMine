# 时间戳设置
timestamp:
  # 时间戳来源类型:
  # - WORLD_CREATION: 使用世界创建时间 (默认)
  # - SERVER_START: 使用服务器启动时间 (每次重启都会改变)
  # - CUSTOM: 使用下面的自定义值
  source: WORLD_CREATION
  
  # 自定义时间戳值 (仅在 CUSTOM 时使用)
  # 设置为 0 则使用当前系统时间
  custom-value: 0

# 偏移范围设置
offset:
  # X轴偏移范围 (方块)
  x:
    min: 5
    max: 10
  
  # Z轴偏移范围 (方块)
  z:
    min: 5
    max: 10
  
  # Y轴偏移范围 (方块)
  y:
    min: 1
    max: 2

# 世界设置
worlds:
  # 为所有世界启用或仅为特定世界启用
  # 设置为 true 则为所有世界启用
  enable-all: true
  
  # 要启用的世界列表 (仅在 enable-all 为 false 时使用)
  enabled-worlds:
    - world
    - world_nether
    - world_the_end

# 更激进的检测
# 开启后会在矿物偏移完成后等待1tick再次检测
# 如果发现矿物仍在原位则强制重新偏移
# 推荐在 Leaves 等服务端上开启
aggressive-verify: true

# 重新检测已加载区块中的矿物
# 开启后，每次加载区块时都会检测并偏移矿物
# 适用于世界已经生成但矿物未被偏移的情况
# 注意：这会增加服务器负载，建议仅在需要修复时临时开启
recheck-loaded-chunks: false

# 调试模式 遇到问题请使用开启debug反馈
debug: false
