name: AntiSeedMine
version: '${version}'
main: org.little100.antiSeedMine.AntiSeedMine
api-version: '1.16'
authors: [Little_100]
description: 根据时间戳随机偏移矿物生成位置，用于降低种子矿透效果。
website: https://www.little100.top
folia-supported: true

commands:
  antiseedmine:
    description: AntiSeedMine 主命令
    usage: /antiseedmine <reload|info|rescan|help>
    aliases: [asm]
    permission: antiseedmine.use

permissions:
  antiseedmine.*:
    description: 所有 AntiSeedMine 权限
    default: op
    children:
      antiseedmine.use: true
      antiseedmine.reload: true
      antiseedmine.info: true
      antiseedmine.rescan: true
  antiseedmine.use:
    description: 使用 AntiSeedMine 命令
    default: op
  antiseedmine.reload:
    description: 重新加载 AntiSeedMine 配置
    default: op
  antiseedmine.info:
    description: 查看 AntiSeedMine 信息
    default: op
  antiseedmine.rescan:
    description: 重新扫描已加载区块
    default: op
